---
# Backup service — a demo playbook: it only prints and waits, on localhost.
- name: Backup service
  hosts: all
  gather_facts: false
  tasks:
    - name: Install restic
      ansible.builtin.pause:
        seconds: 1
    - name: Install the timer
      ansible.builtin.pause:
        seconds: 1
    - name: Show what was installed
      ansible.builtin.debug:
        msg: "Backup service on {{ inventory_hostname }} — {{ api_tag | default('') }} {{ app_tag | default('') }}"
