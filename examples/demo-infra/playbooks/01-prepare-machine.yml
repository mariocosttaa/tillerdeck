---
# Prepare the machine — a demo playbook: it only prints and waits, on localhost.
- name: Prepare the machine
  hosts: all
  gather_facts: false
  tasks:
    - name: Install base packages
      ansible.builtin.pause:
        seconds: 1
    - name: Configure swap
      ansible.builtin.pause:
        seconds: 1
    - name: Install Docker
      ansible.builtin.pause:
        seconds: 2
    - name: Show what was installed
      ansible.builtin.debug:
        msg: "Prepare the machine on {{ inventory_hostname }} — {{ api_tag | default('') }} {{ app_tag | default('') }}"
