# Builds the Linux packages (AppImage and .deb) for a tag and attaches them
# to that tag's GitHub release. Run it by hand: Actions → Linux release → Run,
# with the tag (v1.0.0, v2.0.0…). The release must already exist.
name: Linux release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (the release must exist)"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
            deb: amd64
          - runner: ubuntu-22.04-arm
            arch: aarch64
            deb: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: System libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev build-essential file

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build
        run: |
          npm ci
          npx tauri build --bundles appimage,deb

      - name: Name the packages
        id: out
        run: |
          set -euo pipefail
          v="${TAG#v}"
          mkdir -p out
          cp src-tauri/target/release/bundle/appimage/*.AppImage "out/Ansible-Mario-${v}-linux-${{ matrix.arch }}.AppImage"
          cp src-tauri/target/release/bundle/deb/*.deb "out/ansible-mario_${v}_${{ matrix.deb }}.deb"
          (cd out && sha256sum * > "SHA256SUMS-linux-${{ matrix.arch }}.txt" && cat SHA256SUMS-linux-*.txt)
        env:
          TAG: ${{ inputs.tag }}

      - name: Attach to the release
        run: gh release upload "$TAG" out/* --clobber -R "$GITHUB_REPOSITORY"
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
